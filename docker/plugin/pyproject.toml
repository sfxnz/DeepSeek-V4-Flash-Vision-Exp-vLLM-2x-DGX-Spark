[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsv4-vision"
version = "0.1.0"
description = "vLLM plugin: official DeepSeek-V4-Flash-Vision-Exp ViT and aligner"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
dsv4_vision = "dsv4_vision:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["dsv4_vision*"]
