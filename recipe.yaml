# Source of truth for the values that repeat across run.sh, README.md and CI.
# Edit here, then `python3 kit/render.py`. CI runs `python3 kit/render.py --check`.
# Every scalar is used as the string you typed (0.80 stays 0.80). `null` means none.
# `&name` anchors a value; `*name` reuses it, so a pinned value is written once.

model:
  id: &model deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  revision: &revision 86f746b36186f0e567729a5c06a8c918caba82a9
  served_name: &served_name deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  family: DeepSeek-V4-Flash
  params: 284B total / 13B active, plus a 32-layer ViT (~0.47B BF16)
  quant: MXFP4 experts, FP8 attention

image:
  base: eugr/spark-vllm-b12x:latest
  digest: sha256:7dc02f162929943ba2e14514066ed2a04bb7e9ed3592d4eb460ebcbb1f8376bd
  local_tag: &image dsv4-flash-vision-sm121
  build: docker/Dockerfile.b12x-vision

engine:
  name: vllm
  version: null

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: &nnodes 2
  tp: &tp 2

serve:
  # The `# BEGIN generated` block of run.sh, in run.sh order. Each key renders as NAME="${NAME:-value}".
  env:
    MODEL: *model
    SERVED_NAME: *served_name
    IMAGE: *image
    CONTAINER_NAME: dsv4-flash-vision-exp
    PORT: 8000
    MASTER_PORT: 29522
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1
    TP: *tp
    NNODES: *nnodes
    MAX_MODEL_LEN: 1048576
    MAX_NUM_SEQS: 2
    UTIL: 0.80
    KV_CACHE_DTYPE: fp8
    KV_CACHE_MEMORY: 12884901888
    BLOCK_SIZE: 256
    NUM_SPECULATIVE_TOKENS: 6
    SPEC: dspark
    LOAD_FORMAT: auto
    MOE_BACKEND: b12x
    MAX_NUM_BATCHED_TOKENS: 8192
    FORCE_UNSAFE_CTX: 0
    ENFORCE_EAGER: 0
    VLLM_USE_BREAKABLE_CUDAGRAPH: 0
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_SHA: *revision
    SKIP_DOWNLOAD: 0
    ORCHESTRATE: auto
    EXTRA_ARGS: ""

readme:
  # Rows of the README "Defaults" table. {NAME} is replaced by serve.env.NAME.
  defaults:
    - Image: "`{IMAGE}`"
    - Model: "`{MODEL}`"
    - "`--tensor-parallel-size` / `--nnodes`": "{TP} / {NNODES}"
    - "`--max-model-len`": "{MAX_MODEL_LEN}"
    - "`--max-num-seqs`": "{MAX_NUM_SEQS}"
    - "`--max-num-batched-tokens`": "{MAX_NUM_BATCHED_TOKENS}"
    - "`--kv-cache-dtype`": "`{KV_CACHE_DTYPE}`"
    - "`--kv-cache-memory`": "`{KV_CACHE_MEMORY}`"
    - "`--moe-backend`": "`{MOE_BACKEND}`"
    - "`--block-size`": "{BLOCK_SIZE}"
    - CUDA graphs: "on, `FULL_AND_PIECEWISE` (`ENFORCE_EAGER=1` reverts to `--enforce-eager`)"
    - Speculative: "DSpark-{NUM_SPECULATIVE_TOKENS} (`SPEC={SPEC}`)"
    - Load format: "`{LOAD_FORMAT}` (safetensors). `LOAD_FORMAT=instanttensor` is opt-in"
    - Tokenizers / tools / reasoning: "`deepseek_v4`"
    - Default thinking: "`thinking=false`, `reasoning_effort=low`"
    - API: "`http://<head>:{PORT}/v1`"
    - Container: "`{CONTAINER_NAME}`"
    - Master port: "{MASTER_PORT}"

measured:
  # The README decode table. One row per (phase, concurrency); a row's three numbers come from one
  # bench_decode.py run. evidence: the file under evidence/ that contains them, or null while there is none.
  # evidence/1m-hillclimb.tsv records the boot decisions (pin, DSpark-6, MHC off, seqs=2), not these numbers.
  decode:
    conditions: streamed greedy, thinking off, 200 completion tokens, 3-run median; max-num-seqs=2, fp8 KV pinned at 12 GiB, context 1048576, DSpark-6, CUDA graphs
    units: {decode: tok/s per stream (median), aggregate: tok/s, ttft_p50: s}
    rows:
      - {phase: prose, concurrency: 1, decode: 26.2, aggregate: 26.2, ttft_p50: 0.39, evidence: evidence/rebench-20260902T202935Z/bench.txt}
      - {phase: prose, concurrency: 2, decode: 20.5, aggregate: 40.5, ttft_p50: 0.40, evidence: evidence/rebench-20260902T202935Z/bench.txt}

links:
  model: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  base_image: https://hub.docker.com/r/eugr/spark-vllm-b12x
  repo: https://github.com/sfxnz/DeepSeek-V4-Flash-Vision-Exp-vLLM-2x-DGX-Spark

bench:
  # kit/bench_decode.py: URL is http://127.0.0.1:{PORT}/v1/chat/completions, model is model.served_name.
  # chat_template_kwargs turn thinking off for this model; every kit probe sends the same kwargs.
  chat_template_kwargs: {thinking: false, reasoning_effort: low}

probes:
  # kit/probes/run-all.sh runs these in order. A bare name has no params; {name: params} passes them.
  # count, thinking_off and hermes_two_turn are model-agnostic OpenAI-API probes; this recipe had no
  # scripts for them before the kit and they are new gates here.
  - smoke
  - count
  - thinking_off
  - tool_call
  - hermes_two_turn
  # 120000 (200,013 prompt tokens) is not gated: README "Measured" records it as a miss.
  - needle: [8000, 32000]
  - vision: {image: solid-red, expect: red}

lint:
  # kit/recipe_lint.py: the recipe-specific expectations. Generic checks live in the script.
  required_files:
    - docker/Dockerfile.b12x-vision
    - docker/plugin/pyproject.toml
    - docker/plugin/dsv4_vision/__init__.py
    - docker/plugin/dsv4_vision/vision.py
    - docker/plugin/dsv4_vision/image_processor.py
    - docker/plugin/dsv4_vision/model.py
    - docker/patch_dspark_skip_bias_vl.py
    - encoding/encoding_dsv4.py
    - tests/test_image_grid.py
    - tests/test_plugin_register.py
    - tests/test_recipe_ops.py
  contains:
    README.md:
      - Recipe scripts are MIT
      - docker build -f docker/Dockerfile.b12x-vision
      - ./run.sh
      - ./stop.sh
      - python3 kit/bench_decode.py
      - http://127.0.0.1:8000/v1/chat/completions
      - SPEC=dspark
      - deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
      - dsv4-flash-vision-sm121
      - Say hello in one sentence.
      - thinking
      - eugr/spark-vllm-b12x:latest
      - eugr/spark-vllm-b12x:latest@sha256:7dc02f162929943ba2e14514066ed2a04bb7e9ed3592d4eb460ebcbb1f8376bd
      - bias_vl
      - is not a multimodal model
      - python3 smoke_vision.py
      - MULTIMODAL_REGISTRY
      - SupportsMultiModal
      - SNAPSHOT_SHA
    run.sh:
      - Do not use stock vllm/vllm-openai on sm_121
      - FORCE_UNSAFE_CTX
      - cannot hold --max-model-len
      - '"method":"dspark"'
      - glm53-flash-nvfp4              # occupancy guard against the GLM serve
    docker/Dockerfile.b12x-vision:
      - 'ENTRYPOINT ["vllm", "serve"]'
      - patch_dspark_skip_bias_vl.py
  forbids:
    README.md:
      - not wired on this SHA
    stop.sh:
      - glm53-flash-nvfp4
  readme_mentions_env: [IMAGE, PORT, MAX_MODEL_LEN, MAX_NUM_SEQS, KV_CACHE_MEMORY, BLOCK_SIZE, SPEC, SERVED_NAME, CONTAINER_NAME, NUM_SPECULATIVE_TOKENS, MAX_NUM_BATCHED_TOKENS, KV_CACHE_DTYPE, MASTER_PORT, LOAD_FORMAT, MOE_BACKEND]
  dockerfile_from:
    docker/Dockerfile.b12x-vision: eugr/spark-vllm-b12x:latest@sha256:7dc02f162929943ba2e14514066ed2a04bb7e9ed3592d4eb460ebcbb1f8376bd
  refuse_cases:
    - {env: {MAX_MODEL_LEN: "2097152"}, expect: cannot hold --max-model-len}
  commands:
    - python3 tests/test_image_grid.py
    - python3 tests/test_plugin_register.py
    - python3 tests/test_recipe_ops.py
    - cmp encoding/encoding_dsv4.py docker/plugin/dsv4_vision/encoding_dsv4.py
